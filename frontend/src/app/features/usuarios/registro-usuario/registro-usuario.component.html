<div class="min-h-screen bg-background-dark flex items-center justify-center p-6">
  <div class="w-full max-w-lg">
    <div class="text-center mb-8">
      <h1 class="text-xl font-light tracking-[0.2em] uppercase text-accent-white">Registrar Usuario</h1>
      <p class="text-sm text-accent-muted mt-2">Crea una nueva cuenta en el sistema</p>
    </div>

    <div
      *ngIf="exito"
      class="mb-6 p-4 border border-green-700 bg-green-900/30 rounded-sm text-sm text-green-300 text-center"
    >
      Usuario registrado exitosamente
    </div>

    <div
      *ngIf="error"
      class="mb-6 p-4 border border-red-700 bg-red-900/30 rounded-sm text-sm text-red-300 text-center"
    >
      {{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-xs uppercase tracking-widest text-accent-muted mb-2">
          Correo electr&oacute;nico
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="usuario@urbe.edu"
          class="w-full bg-surface-dark border border-surface-border rounded-sm px-4 py-2.5 text-sm text-accent-white placeholder-accent-subtle focus:outline-none focus:border-accent-white focus:ring-1 focus:ring-accent-white transition-colors"
        />
      </div>

      <div>
        <label for="nombreCompleto" class="block text-xs uppercase tracking-widest text-accent-muted mb-2">
          Nombre Completo
        </label>
        <input
          id="nombreCompleto"
          type="text"
          formControlName="nombreCompleto"
          placeholder="Nombre y Apellido"
          class="w-full bg-surface-dark border border-surface-border rounded-sm px-4 py-2.5 text-sm text-accent-white placeholder-accent-subtle focus:outline-none focus:border-accent-white focus:ring-1 focus:ring-accent-white transition-colors"
        />
      </div>

      <div>
        <label for="rol" class="block text-xs uppercase tracking-widest text-accent-muted mb-2">Rol</label>
        <select
          id="rol"
          formControlName="rol"
          class="w-full bg-surface-dark border border-surface-border rounded-sm px-4 py-2.5 text-sm text-accent-white focus:outline-none focus:border-accent-white focus:ring-1 focus:ring-accent-white transition-colors"
        >
          <option value="" disabled class="text-accent-subtle">Seleccionar rol</option>
          <option *ngFor="let r of roles" [value]="r" class="bg-surface-dark">{{ r }}</option>
        </select>
      </div>

      <div>
        <label for="password" class="block text-xs uppercase tracking-widest text-accent-muted mb-2">
          Contrase&ntilde;a Temporal
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Contrase&ntilde;a"
          class="w-full bg-surface-dark border border-surface-border rounded-sm px-4 py-2.5 text-sm text-accent-white placeholder-accent-subtle focus:outline-none focus:border-accent-white focus:ring-1 focus:ring-accent-white transition-colors"
        />
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full py-2.5 text-sm uppercase tracking-widest border border-accent-white text-accent-white bg-transparent rounded-sm hover:bg-accent-white hover:text-background-dark transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Registrando...' : 'Registrar Usuario' }}
      </button>
    </form>
  </div>
</div>
