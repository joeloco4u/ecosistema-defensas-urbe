<div class="bg-background-dark p-8 space-y-8 min-h-screen">
  <div>
    <h1 class="text-2xl font-semibold text-accent-white tracking-tight">Panel de Coordinación</h1>
    <p class="text-sm text-accent-muted mt-1">Resumen del estado actual del sistema de defensas</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-surface-dark border border-surface-border rounded-sm p-6">
      <p class="text-xs uppercase tracking-widest text-accent-muted">Proyectos Pendientes</p>
      <p class="text-4xl font-light text-red-400 mt-2">3</p>
    </div>
    <div class="bg-surface-dark border border-surface-border rounded-sm p-6">
      <p class="text-xs uppercase tracking-widest text-accent-muted">Defensas esta Semana</p>
      <p class="text-4xl font-light text-accent-white mt-2">0</p>
    </div>
    <div class="bg-surface-dark border border-surface-border rounded-sm p-6">
      <p class="text-xs uppercase tracking-widest text-accent-muted">Reprogramaciones</p>
      <p class="text-4xl font-light text-accent-white mt-2">0</p>
    </div>
  </div>

  <div>
    <h2 class="text-lg font-medium text-accent-white mb-4">Proyectos de Seminario III</h2>
    <div class="bg-surface-dark border border-surface-border rounded-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-surface-border">
            <th class="text-left px-6 py-4 text-xs uppercase tracking-widest text-accent-muted font-medium">Tesista</th>
            <th class="text-left px-6 py-4 text-xs uppercase tracking-widest text-accent-muted font-medium">Proyecto</th>
            <th class="text-left px-6 py-4 text-xs uppercase tracking-widest text-accent-muted font-medium">Tutor</th>
            <th class="text-left px-6 py-4 text-xs uppercase tracking-widest text-accent-muted font-medium">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-surface-border">
          <tr *ngFor="let p of proyectosPendientes" class="hover:bg-surface-light transition-colors">
            <td class="px-6 py-4 text-accent-white">{{ p.tesista }}</td>
            <td class="px-6 py-4 text-accent-muted">{{ p.titulo }}</td>
            <td class="px-6 py-4 text-accent-muted">{{ p.tutor }}</td>
            <td class="px-6 py-4">
              <button
                (click)="abrirModalAgendamiento(p)"
                class="px-4 py-1.5 text-xs uppercase tracking-widest border border-gray-700 text-accent-muted bg-transparent rounded-sm hover:bg-accent-white hover:text-background-dark transition-colors"
              >
                Agendar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-modal-agendamiento
  [isOpen]="modalAbierto"
  [proyecto]="proyectoSeleccionado"
  (closeModal)="cerrarModal()"
  (confirmar)="onConfirmarDefensa($event)"
></app-modal-agendamiento>
