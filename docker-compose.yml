version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: defensas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: defensas_db
      POSTGRES_USER: defensas_user
      POSTGRES_PASSWORD: defensas_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
